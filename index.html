<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>iFone · Fantasy OS de #iHunt</title>
<meta name="description" content="Um celular de mentira com os apps do mundo de #iHunt. Cada app sorteia um resultado para usar na mesa.">
<meta name="theme-color" content="#141414">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=VT323&family=Rubik+Mono+One&family=Permanent+Marker&family=Bangers&family=Special+Elite&display=swap">
<style>
/* Layout: one phone rig centred on a "desk"; each skin swaps the phone body, the home paradigm and the result format, not only colours. */
:root{
  color-scheme:dark;--px-clip:polygon(0 15px,5px 15px,5px 10px,10px 10px,10px 5px,15px 5px,15px 0,calc(100% - 15px) 0,calc(100% - 15px) 5px,calc(100% - 10px) 5px,calc(100% - 10px) 10px,calc(100% - 5px) 10px,calc(100% - 5px) 15px,100% 15px,100% calc(100% - 15px),calc(100% - 5px) calc(100% - 15px),calc(100% - 5px) calc(100% - 10px),calc(100% - 10px) calc(100% - 10px),calc(100% - 10px) calc(100% - 5px),calc(100% - 15px) calc(100% - 5px),calc(100% - 15px) 100%,15px 100%,15px calc(100% - 5px),10px calc(100% - 5px),10px calc(100% - 10px),5px calc(100% - 10px),5px calc(100% - 15px),0 calc(100% - 15px));--px-pink:#ff77a8;
  --bar-bg:#0b0b0f;--bar-fg:#f2f2f2;--bar-on:#ffec27;
  --stage:#1d2b53;
  --px-black:#000;--px-navy:#1d2b53;--px-white:#fff1e8;--px-red:#ff004d;--px-yellow:#ffec27;--px-grey:#c2c3c7;--px-lav:#83769c;--px-dark:#5f574f;--px-blue:#29adff;--px-green:#00e436;
  --lcd:#b9c9a3;--lcd-ink:#27331f;--lcd-dim:#8fa07c;--brick:#1c2740;--brick-hi:#34466e;--key:#d9dde6;--key-ink:#1c2740;
  --gl-ink:#f5f6fa;--gl-dim:#b9bfd0;--gl-paper:#ffffff;--gl-text:#14161c;--gl-mute:#6a7183;--gl-line:#e6e8ee;--gl-body:#17181c;
  --zn-paper:#f6efe0;--zn-ink:#141414;--zn-pink:#ff3d8b;--zn-yellow:#ffd400;--zn-cyan:#19c8d6;--zn-red:#d9200f;
  --f-px:'Press Start 2P',monospace;--f-px2:'Pixelify Sans','Trebuchet MS',sans-serif;--f-lcd:'VT323','Courier New',monospace;
  --f-gl:'Plus Jakarta Sans',system-ui,sans-serif;--f-zn1:'Rubik Mono One',Impact,sans-serif;--f-zn2:'Permanent Marker','Comic Sans MS',cursive;--f-zn3:'Bangers',Impact,sans-serif;--f-zn4:'Special Elite','Courier New',monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--stage);color:var(--bar-fg);font-family:system-ui,sans-serif;overflow:hidden;display:flex;flex-direction:column}
body[data-skin=b]{--stage:#2b3a36;}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible{outline:3px solid var(--bar-on);outline-offset:2px}
img.spr{image-rendering:pixelated;display:block}

#bar{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--bar-bg);z-index:20}
#bar button{font-size:12px;font-weight:600;padding:6px 10px;border:1px solid #fff4;border-radius:99px;color:var(--bar-fg)}
#bar button[aria-pressed=true]{background:var(--bar-on);color:#000;border-color:var(--bar-on)}
#stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;position:relative}
#rig{position:relative;width:min(370px,100vw);height:min(740px,100%);max-height:calc(100% - 24px)}
#phone{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column}
#screen{flex:1;min-height:0;overflow:hidden;position:relative;display:flex;flex-direction:column}
#keys{display:none}
@media (max-width:700px){#rig{width:100%;height:100%;max-height:100%}}

/* ───── A · Cartucho (PICO-8) ───── */
.a-top{display:flex;justify-content:space-between;background:var(--px-red);color:var(--px-white);font:9px var(--f-px);padding:9px 10px}
.a-wrap{flex:1;min-height:0;overflow:auto;padding:14px 12px;background:var(--px-navy) conic-gradient(#0004 25%,#0000 0 50%,#0004 0 75%,#0000 0) 0 0/6px 6px;display:flex;flex-direction:column;gap:14px}
.a-h{font:11px/1.5 var(--f-px);color:var(--px-yellow);text-shadow:2px 2px 0 #000;text-align:center}
.a-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px 6px}
.a-ic{display:flex;flex-direction:column;align-items:center;gap:8px;font:8px var(--f-px);color:var(--px-white);text-shadow:1px 1px 0 #000}
.a-ic .tile{background:var(--px-black);padding:7px;box-shadow:0 0 0 4px var(--px-white),5px 5px 0 4px #0008}
.a-ic.sel .tile{box-shadow:0 0 0 4px var(--px-yellow),5px 5px 0 4px #0008;animation:bob .5s steps(2) infinite}
.a-ic.sel span{color:var(--px-yellow)}
.a-ic.sel span::before{content:"▶"}
@keyframes bob{50%{transform:translateY(-4px)}}
.a-hint{font:7px/1.8 var(--f-px);color:var(--px-grey);text-align:center;margin-top:auto}
.a-box{background:var(--px-black);box-shadow:0 0 0 4px var(--px-white),0 0 0 8px var(--px-black);margin:8px;padding:12px;display:flex;flex-direction:column;gap:8px}
.a-head{display:flex;gap:12px;align-items:center}
.a-head b{font:10px/1.6 var(--f-px);color:var(--px-yellow);min-height:48px;display:block}
.a-tag{font:7px var(--f-px);background:var(--px-blue);color:#000;padding:4px 5px;display:inline-block;margin-bottom:6px}
.a-row{display:flex;gap:6px;align-items:baseline;opacity:0;animation:pop 0s forwards}
.a-row i{font-style:normal;color:var(--px-grey);white-space:nowrap}
.a-row u{flex:1;min-width:10px;border-bottom:3px dotted var(--px-dark);text-decoration:none}
.a-row b{font-weight:600;text-align:right;max-width:62%}
@keyframes pop{to{opacity:1}}
.a-btns{display:grid;grid-template-columns:1fr 1fr;gap:14px 12px;margin:4px 6px}
.a-btn{font:9px var(--f-px);padding:12px 4px;background:var(--px-red);color:var(--px-white);box-shadow:0 0 0 4px var(--px-black),0 6px 0 4px #7e2553}
.a-btn:active{transform:translateY(4px);box-shadow:0 0 0 4px var(--px-black),0 2px 0 4px #7e2553}
.a-btn.alt{background:var(--px-blue);color:#000;box-shadow:0 0 0 4px var(--px-black),0 6px 0 4px #1d2b53}
.a-btn.wide{grid-column:1/-1;background:var(--px-dark);box-shadow:0 0 0 4px var(--px-black),0 6px 0 4px #000}
.a-save{font:7px/1.9 var(--f-px);color:var(--px-green)}

/* ───── B · Tijolão (LCD) ───── */
[data-skin=b] #rig{width:min(310px,100vw)}
[data-skin=b] #phone{background:linear-gradient(100deg,var(--brick-hi),var(--brick) 30%,#0f1626);border-radius:46px 46px 90px 90px;padding:54px 22px 30px;box-shadow:0 30px 60px #0007,inset 0 2px 0 #fff3}
[data-skin=b] #phone::before{content:"NOKTIS";position:absolute;top:22px;left:0;right:0;text-align:center;font:600 12px system-ui;letter-spacing:.35em;color:#c9d2e6}
[data-skin=b] #screen{flex:0 0 44%;background:var(--lcd);color:var(--lcd-ink);font:24px/1 var(--f-lcd);border:9px solid #0a0f1c;border-radius:10px;box-shadow:inset 3px 3px 0 #0003;background-image:linear-gradient(#0000 3px,#0000000a 3px),linear-gradient(90deg,#0000 3px,#0000000a 3px);background-size:4px 4px}
.b-st{display:flex;justify-content:space-between;padding:4px 8px;font-size:18px}
.b-mid{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;padding:0 8px}
.b-mid .nm{font-size:30px}
.b-mid .ar{font-size:18px;color:var(--lcd-dim)}
.b-txt{flex:1;min-height:0;overflow:auto;padding:2px 10px;font-size:22px;line-height:1.05;scrollbar-width:none}
.b-txt p{margin:0 0 6px}.b-txt .t{border-bottom:2px solid var(--lcd-ink);padding-bottom:3px}
.b-soft{display:flex;justify-content:space-between;padding:3px 8px;font-size:20px;border-top:2px solid var(--lcd-ink)}
[data-skin=b] #keys{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:space-evenly;gap:8px;padding:10px 6px 0}
#keys button{color:var(--key-ink);font:700 17px system-ui;display:grid;place-items:center}
.k-top{display:grid;grid-template-columns:1fr 88px 1fr;grid-template-rows:34px 34px;gap:8px 12px;align-items:stretch}
.k-top .soft,.k-top .call,.k-top .end{border-radius:18px;background:linear-gradient(#f4f6fa,var(--key));box-shadow:0 3px 0 #0008,inset 0 -2px 0 #0002}
.k-top .soft i{display:block;width:22px;height:4px;border-radius:2px;background:var(--key-ink)}
.k-top .soft:first-child{border-radius:22px 10px 10px 22px;transform:rotate(-6deg)}
.k-top #k-softr{border-radius:10px 22px 22px 10px;transform:rotate(6deg)}
.k-top .call{background:linear-gradient(#6fd896,#1f9d55);color:#fff;border-radius:10px 10px 10px 26px}
.k-top .end{background:linear-gradient(#f28587,#c62f3a);color:#fff;border-radius:10px 10px 26px 10px}
.k-top .end svg{transform:rotate(135deg)}
.k-pad{grid-row:1/3;grid-column:2;position:relative;border-radius:50%;background:radial-gradient(circle at 50% 35%,#fff,#aab3c6);box-shadow:0 4px 0 #0008,inset 0 0 0 3px #ffffff80,inset 0 0 0 4px #0002;height:88px;align-self:center}
.k-pad button{position:absolute;left:0;right:0;height:50%;font-size:11px;border-radius:0}
#k-up{top:0;border-radius:44px 44px 0 0;padding-bottom:18px}#k-down{bottom:0;border-radius:0 0 44px 44px;padding-top:18px}
.k-pad .ok{left:50%;top:50%;right:auto;width:38px;height:38px;margin:-19px 0 0 -19px;border-radius:50%;background:linear-gradient(#34466e,var(--brick));color:#e8ecf5;font-size:10px;letter-spacing:.05em;box-shadow:0 0 0 2px #0003,inset 0 1px 0 #fff5}
.k-num{display:grid;grid-template-columns:repeat(3,1fr);gap:7px 10px;padding:0 4px}
.k-num button{grid-auto-flow:column;justify-content:center;gap:5px;padding:6px 0;background:linear-gradient(#f4f6fa,var(--key));border-radius:16px/50%;box-shadow:0 3px 0 #0008,inset 0 -2px 0 #0002}
.k-num button:nth-child(3n+1){border-radius:20px 12px 12px 20px/50%;transform:translateY(-3px)}
.k-num button:nth-child(3n){border-radius:12px 20px 20px 12px/50%;transform:translateY(-3px)}
.k-num small{font-size:8px;font-weight:600;letter-spacing:.08em;opacity:.6;min-width:22px;text-align:left}
#keys button:active{filter:brightness(.85)}
[data-skin=b] #screen{flex-basis:40%}
@media (max-width:700px){[data-skin=b] #rig{width:100%}[data-skin=b] #phone{border-radius:0;padding:40px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px))}[data-skin=b] #phone::before{top:14px}}

/* ───── D · Zine ───── */
.d-wrap{flex:1;min-height:0;overflow:auto;padding:16px 16px 20px;display:flex;flex-direction:column;gap:14px}
.d-mast{font:44px/.85 var(--f-zn1);transform:rotate(-3deg);margin:6px 0 0}
.d-mast em{font-style:normal;color:var(--zn-pink);-webkit-text-stroke:2px var(--zn-ink)}
.d-sub{display:flex;justify-content:space-between;border-block:3px solid var(--zn-ink);padding:4px 0;font-size:12px;text-transform:uppercase}
.d-stk{display:flex;flex-wrap:wrap;gap:14px 10px;justify-content:center;align-items:center;padding:6px 0}
.d-s{padding:10px 14px;border:3px solid var(--zn-ink);box-shadow:4px 4px 0 var(--zn-ink);background:var(--bg);color:var(--fg,var(--zn-ink));transform:rotate(var(--rot));font:var(--fs) var(--ff);border-radius:var(--br,0)}
.d-s:hover,.d-s:focus-visible{transform:rotate(0) scale(1.06)}
.d-foot{font:14px var(--f-zn2);text-align:center;transform:rotate(1.5deg);margin-top:auto}
.d-back{font:15px var(--f-zn2);text-align:left;text-decoration:underline wavy var(--zn-pink)}
.d-clip{position:relative;background:#fffdf5;border:3px solid var(--zn-ink);padding:22px 14px 14px;transform:rotate(1.2deg);box-shadow:5px 5px 0 var(--bg)}
.d-clip::before{content:"";position:absolute;top:-13px;left:50%;width:96px;height:24px;margin-left:-48px;background:#ffd40099;border-inline:2px dashed #0003;transform:rotate(-4deg)}
.d-kick{font:13px var(--f-zn1);background:var(--zn-ink);color:var(--zn-paper);display:inline-block;padding:3px 7px;transform:rotate(-2deg)}
.d-clip h3{font:30px/1 var(--f-zn3);letter-spacing:.02em;margin:10px 0 8px;padding-right:76px;text-wrap:balance}
.d-stamp{position:absolute;right:8px;top:36px;width:84px;height:84px;border:4px double var(--zn-red);border-radius:50%;color:var(--zn-red);display:grid;place-items:center;text-align:center;font:17px/1 var(--f-zn1);transform:rotate(14deg);opacity:.85}
.d-clip p{margin:0 0 5px}.d-clip p b{background:linear-gradient(#0000 55%,var(--zn-yellow) 0)}
.d-btns{display:flex;gap:12px;justify-content:center}
.d-b{font:22px var(--f-zn3);letter-spacing:.04em;padding:10px 18px;background:var(--zn-pink);border:3px solid var(--zn-ink);box-shadow:4px 4px 0 var(--zn-ink);transform:rotate(-2deg)}
.d-b.alt{background:var(--zn-cyan);transform:rotate(2deg)}
.d-b:active{box-shadow:1px 1px 0 var(--zn-ink);translate:3px 3px}
.d-saved{font:14px var(--f-zn2)}

/* ───── F · Cartucho punk (estrutura do 1 com papel e tinta do 4) ───── */
body[data-skin=f]{background:var(--zn-cyan) radial-gradient(#0003 1.5px,#0000 1.6px) 0 0/9px 9px}
[data-skin=f] #phone{background:var(--zn-ink);padding:12px;border-radius:38px 46px 34px 48px/46px 34px 48px 38px;box-shadow:10px 10px 0 var(--zn-ink);transform:rotate(1deg)}
[data-skin=f] #screen{background:var(--zn-paper) radial-gradient(#0000001f 1px,#0000 1.2px) 0 0/6px 6px;color:var(--zn-ink);border-radius:26px 34px 24px 36px/34px 24px 36px 26px;font:15px/1.35 var(--f-zn4)}
.f-top{display:flex;justify-content:space-between;background:var(--zn-ink);color:var(--zn-paper);font:12px var(--f-zn1);padding:12px 18px 10px}
.f-wrap{flex:1;min-height:0;overflow:auto;padding:16px 14px;display:flex;flex-direction:column;gap:16px}
.f-h{font:32px/1 var(--f-zn3);letter-spacing:.03em;text-align:center;transform:rotate(-2deg);margin:0}
.f-h span{background:linear-gradient(#0000 50%,var(--zn-yellow) 0)}
.f-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px 8px}
.f-ic{display:flex;flex-direction:column;align-items:center;gap:8px;font:15px var(--f-zn2)}
.f-ic .tile{background:var(--bg);border:3px solid var(--zn-ink);box-shadow:4px 4px 0 var(--zn-ink);padding:8px;transform:rotate(var(--rot))}
.f-ic.sel .tile{animation:bob .5s steps(2) infinite;outline:4px solid var(--zn-pink);outline-offset:3px}
.f-ic.sel span{background:var(--zn-ink);color:var(--zn-paper);padding:0 6px}
.f-hint{font:13px var(--f-zn2);text-align:center;margin-top:auto;transform:rotate(1deg)}
.f-box{position:relative;background:#fffdf5;border:3px solid var(--zn-ink);box-shadow:6px 6px 0 var(--zn-pink);padding:14px;display:flex;flex-direction:column;gap:7px;transform:rotate(-.6deg)}
.f-head{display:flex;gap:12px;align-items:center;margin-bottom:4px}
.f-head .tile{border:3px solid var(--zn-ink);background:var(--zn-yellow);padding:6px;transform:rotate(-4deg);flex:none}
.f-head b{font:26px/1 var(--f-zn3);letter-spacing:.02em;display:block;min-height:52px}
.f-tag{font:10px var(--f-zn1);background:var(--zn-ink);color:var(--zn-paper);padding:3px 6px;display:inline-block;margin-bottom:4px}
[data-skin=f] .a-row i{color:#555}[data-skin=f] .a-row u{border-color:var(--zn-ink)}[data-skin=f] .a-row b{font-weight:400;background:linear-gradient(#0000 55%,var(--zn-yellow) 0)}
@media (max-width:700px){[data-skin=f] #phone{padding:0;border-radius:0;transform:none;box-shadow:none}[data-skin=f] #screen{border-radius:0}}

.f-kick{font:13px var(--f-zn1);background:var(--zn-ink);color:var(--zn-paper);padding:6px 9px;align-self:flex-start;transform:rotate(-1.5deg)}
.f-list{display:flex;flex-direction:column;gap:14px}
.f-it{display:flex;gap:10px;align-items:center;text-align:left;background:#fffdf5;border:3px solid var(--zn-ink);box-shadow:5px 5px 0 var(--sh);padding:10px 12px;transform:rotate(var(--rot))}
.f-it>div{min-width:0}
.f-it b{font:22px/1 var(--f-zn3);letter-spacing:.02em;display:block}
.f-it small{font-size:13px;line-height:1.25;display:block;margin-top:4px}
.f-it .r{margin-left:auto;font:12px/1.2 var(--f-zn1);color:var(--zn-red);border:3px double var(--zn-red);padding:5px 6px;transform:rotate(6deg);flex:none;text-align:center;max-width:92px}
.f-it:hover,.f-it:focus-visible{transform:rotate(0) translate(-2px,-2px)}
.f-note{font:15px/1.3 var(--f-zn2);margin:6px 0 0;padding-top:8px;border-top:3px dashed var(--zn-ink)}
.f-foot{font:14px var(--f-zn2);text-align:center;margin:0;transform:rotate(1deg)}
.d-btns{flex-wrap:wrap}
.b-txt p.m{margin:0;padding:1px 2px;cursor:pointer}.b-txt p.m.sel{background:var(--lcd-ink);color:var(--lcd)}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.a-row{opacity:1}}
</style>
</head>
<body>


<div id="bar" role="group" aria-label="Estilo do celular"></div>
<div id="stage"><div id="rig">
  <div id="phone"><div id="screen"></div>
    <div id="keys">
      <div class="k-top">
        <button class="soft" data-act="softL" id="k-softl" aria-label="Tecla esquerda"><i></i></button>
        <div class="k-pad"><button data-act="nav" data-arg="-1" id="k-up" aria-label="Cima">▲</button><button data-act="nav" data-arg="1" id="k-down" aria-label="Baixo">▼</button><button class="ok" data-act="ok" id="k-ok">OK</button></div>
        <button class="soft" data-act="softR" id="k-softr" aria-label="Tecla direita"><i></i></button>
        <button class="call" data-act="ok" id="k-call" aria-label="Atender"><svg viewBox="0 0 24 10" width="26" height="11" aria-hidden="true"><path d="M1 9c0-11 22-11 22 0l-5 1-1.5-4.5c-3-1-6-1-9 0L6 10z" fill="currentColor"/></svg></button>
        <button class="end" data-act="home" id="k-end" aria-label="Desligar"><svg viewBox="0 0 24 10" width="26" height="11" aria-hidden="true"><path d="M1 9c0-11 22-11 22 0l-5 1-1.5-4.5c-3-1-6-1-9 0L6 10z" fill="currentColor"/></svg></button>
      </div>
      <div class="k-num"><button data-act="num" data-arg="1" id="k1">1<small></small></button><button data-act="num" data-arg="2" id="k2">2<small>ABC</small></button><button data-act="num" data-arg="3" id="k3">3<small>DEF</small></button><button data-act="num" data-arg="4" id="k4">4<small>GHI</small></button><button data-act="num" data-arg="5" id="k5">5<small>JKL</small></button><button data-act="num" data-arg="6" id="k6">6<small>MNO</small></button><button data-act="num" data-arg="7" id="k7">7<small>PQRS</small></button><button data-act="num" data-arg="8" id="k8">8<small>TUV</small></button><button data-act="num" data-arg="9" id="k9">9<small>WXYZ</small></button><button data-act="pin" id="k-star" aria-label="Guardar">*<small>+</small></button><button data-act="num" data-arg="0" id="k0">0<small>␣</small></button><button data-act="softR" id="k-hash" aria-label="Voltar">#<small>⇧</small></button></div>
    </div>
  </div>
</div></div>

<script>
const pick=a=>a[Math.floor(Math.random()*a.length)], rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const money=n=>'R$ '+n.toLocaleString('pt-BR'), stars=n=>'★'.repeat(n)+'☆'.repeat(5-n);

const KEYS=Object.keys(APPS);
const PAL={k:'#000',w:'#fff1e8',r:'#ff004d',o:'#ffa300',y:'#ffec27',g:'#00e436',b:'#29adff',p:'#ff77a8',d:'#5f574f',l:'#c2c3c7',n:'#ab5236'};
function sprite(rows,mono){const c=document.createElement('canvas');c.width=c.height=10;const x=c.getContext('2d');rows.forEach((r,j)=>[...r].forEach((ch,i)=>{if(ch!=='.'){x.fillStyle=mono||PAL[ch];x.fillRect(i,j,1,1)}}));return c.toDataURL()}
KEYS.forEach(k=>{APPS[k].img=sprite(APPS[k].spr);APPS[k].mono=sprite(APPS[k].spr,'#27331f')});
const spr=(k,s,mono)=>`<img class="spr" alt="" width="${s}" height="${s}" src="${mono?APPS[k].mono:APPS[k].img}">`;
const SKINS={f:'Cartucho punk',b:'Tijolão'};
let skin=(x=>SKINS[x]?x:'f')(store.get('fos-skin','f')),view='home',sel=0,bsel=0,ST={},M=null,fresh=false,follow=false;
const scr=document.getElementById('screen'),bar=document.getElementById('bar');
const hhmm=()=>new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
const pins=k=>store.get('fos-pin-'+k,[]);
const menu=m=>[...(m.items||[]).map(i=>({label:`${i.t} (${i.r})`,act:i.act,arg:i.arg})),...(m.actions||[])];
const btn=(x,i,cls)=>`<button class="${cls}" data-act="${x.act}" ${x.arg!==undefined?`data-arg="${x.arg}"`:''} id="act-${x.act}-${x.arg??i}">`;

const R={
b:{home:()=>{const k=KEYS[sel];return`<div class="b-st"><span>▂▄▆█</span><span>${hhmm()}</span><span>▮▮▮</span></div><div class="b-mid"><span class="ar">▲ ${sel+1}/${KEYS.length}</span>${spr(k,90,1)}<span class="nm">${APPS[k].name}</span><span class="ar">▼</span></div><div class="b-soft"><span>Abrir</span><span>by javaijafoi</span></div>`},
 app:(k,a,m)=>{const c=m.card,mn=menu(m),p=pins(k);return`<div class="b-st"><span>${a.name}</span><span>${hhmm()}</span></div><div class="b-txt" id="b-txt">${m.kicker?`<p class="t">${m.kicker}</p>`:''}${c?`<p class="t">${c.title}</p><p>${c.tag}</p>${c.rows.map(x=>`<p>${x[0]}: ${x[1]}</p>`).join('')}${c.note?`<p>${c.note}</p>`:''}`:''}${mn.map((x,i)=>`<p class="m ${i===bsel?'sel':''}" data-act="${x.act}" ${x.arg!==undefined?`data-arg="${x.arg}"`:''}>${i===bsel?'▶':'·'} ${x.label}</p>`).join('')}${m.foot?`<p>${m.foot}</p>`:''}${p.length&&!c?`<p class="t">Guardados: ${p.length}</p>`+p.map(x=>`<p>${x.title}</p>`).join(''):''}</div><div class="b-soft"><span>Selec.</span><span>Voltar</span></div>`}},
f:{home:()=>{const C=['--zn-pink','--zn-cyan','--zn-yellow'],T=[-3,2,-1,3,-2,1,2];return`<div class="f-top"><span>iHUNT-OS</span><span>${hhmm()}</span></div><div class="f-wrap"><h1 class="f-h"><span>ESCOLHE UM APP</span></h1><div class="f-grid">${KEYS.map((k,i)=>`<button class="f-ic ${i===sel?'sel':''}" data-act="open" data-arg="${k}" id="f-${k}"><div class="tile" style="--bg:var(${C[i%3]});--rot:${T[i]}deg">${spr(k,50)}</div><span>${APPS[k].name}</span></button>`).join('')}</div><p class="f-hint">setas movem, enter abre. by @javaijafoi</p></div>`},
 app:(k,a,m)=>{const c=m.card,p=pins(k),SH=['--zn-pink','--zn-cyan','--zn-yellow'];return`<div class="f-top"><span>${a.name.toUpperCase()}</span><span>${hhmm()}</span></div><div class="f-wrap"><button class="d-back" data-act="back" id="f-back">← voltar</button>${m.kicker?`<div class="f-kick">${m.kicker}</div>`:''}${c?`<div class="f-box"><div class="f-head"><div class="tile">${spr(k,50)}</div><div><span class="f-tag">${c.tag}</span><b id="a-type">${fresh?'':c.title.toUpperCase()}</b></div></div>${c.rows.map((x,i)=>`<div class="a-row" style="animation-delay:${fresh?(i+1)*.14:0}s"><i>${x[0]}</i><u></u><b>${x[1]}</b></div>`).join('')}${c.note?`<p class="f-note">${c.note}</p>`:''}</div>`:''}${m.items?`<div class="f-list">${m.items.map((x,i)=>btn(x,i,'f-it')+`<div><b>${x.t}</b><small>${x.s}</small></div><span class="r">${x.r}</span></button>`).join('').replace(/class="f-it"/g,(_m,o)=>`class="f-it" style="--sh:var(${SH[(o>>3)%3]});--rot:${[-1,.8,-.5][(o>>3)%3]}deg"`)}</div>`:''}<div class="d-btns">${(m.actions||[]).map((x,i)=>btn(x,i,'d-b'+(x.alt||i%2?' alt':''))+x.label.toUpperCase()+'</button>').join('')}</div>${m.foot?`<p class="f-foot">${m.foot}</p>`:''}${p.length&&!c?`<div class="d-saved">guardados: ${p.map(x=>x.title).join(' / ')}</div>`:''}</div>`}}
};
let typeT;
function render(){
  document.body.dataset.skin=skin;
  bar.innerHTML=Object.entries(SKINS).map(([k,v])=>`<button data-skin-to="${k}" id="sk-${k}" aria-pressed="${k===skin}">${v}</button>`).join('');
  const old=document.getElementById('b-txt'),top=old?old.scrollTop:0;
  if(view==='home'){M=null;scr.innerHTML=R[skin].home()}
  else{const a=APPS[view];if(!ST[view]){ST[view]=a.init();fresh=true}M=a.screen(ST[view]);bsel=Math.min(bsel,Math.max(0,menu(M).length-1));scr.innerHTML=R[skin].app(view,a,M)}
  const t2=document.getElementById('b-txt');if(t2){t2.scrollTop=fresh?0:top;if(follow){const e=t2.querySelector('.sel');if(e)e.scrollIntoView({block:'nearest'})}}
    clearInterval(typeT);const t=document.getElementById('a-type');
  if(t&&fresh&&M&&M.card){const s=M.card.title.toUpperCase();let i=0;typeT=setInterval(()=>{t.textContent=s.slice(0,++i);if(i>=s.length)clearInterval(typeT)},24)}
  fresh=false;follow=false;
}
function bnav(d){const t=document.getElementById('b-txt'),n=menu(M).length,e=t&&t.querySelector('.sel');if(!t)return;
  const vis=e&&e.offsetTop>=t.scrollTop&&e.offsetTop+e.offsetHeight<=t.scrollTop+t.clientHeight;
  if(d>0){if(e&&!vis&&e.offsetTop>t.scrollTop){t.scrollTop+=44;return}if(bsel<n-1){bsel++;follow=true;render()}else t.scrollTop+=44}
  else{if(bsel>0&&vis){bsel--;follow=true;render()}else t.scrollTop-=44}}
function act(a,arg){
  const n=KEYS.length;
  if(view==='home'){
    if(a==='open'){view=arg;sel=KEYS.indexOf(arg);bsel=0;fresh=true}
    else if(a==='nav')sel=(sel+ +arg+n)%n;
    else if(a==='softL'||a==='ok')return act('open',KEYS[sel]);
    else if(a==='num'){if(KEYS[arg-1])return act('open',KEYS[arg-1]);return}
    else return;
  }else{
    const app=APPS[view],st=ST[view],mn=menu(M);
    if(a==='home')view='home';
    else if(a==='back'||a==='softR'){if(!(app.back&&app.back(st)))view='home';bsel=0;fresh=true}
    else if(a==='nav')return bnav(+arg);
    else if(a==='softL'||a==='ok'){if(mn[bsel])return act(mn[bsel].act,mn[bsel].arg);return}
    else if(a==='num'){if(mn[arg-1])return act(mn[arg-1].act,mn[arg-1].arg);return}
    else if(a==='pin'){if(M.card){const p=pins(view);if(!p.some(x=>x.title===M.card.title))store.set('fos-pin-'+view,[{title:M.card.title},...p].slice(0,8))}}
    else{const r=app.on(st,a,arg);if(r)ST[view]=r;bsel=0;fresh=true}
  }
  render();
}
document.addEventListener('click',e=>{const s=e.target.closest('[data-skin-to]');if(s){skin=s.dataset.skinTo;store.set('fos-skin',skin);render();return}const b=e.target.closest('[data-act]');if(b)act(b.dataset.act,b.dataset.arg)});
document.addEventListener('keydown',e=>{const cols=skin==='f'&&view==='home'?3:1,m={ArrowLeft:-1,ArrowRight:1,ArrowUp:-cols,ArrowDown:cols};if(m[e.key]!==undefined){if(skin==='f'&&view!=='home')return;e.preventDefault();act('nav',skin==='b'?Math.sign(m[e.key]):m[e.key])}else if(e.key==='Enter'&&!e.target.closest('button')){act('ok')}else if(e.key==='Escape')act(view==='home'?'home':'back')});
render();setInterval(()=>{if(view==='home')render()},30000);
</script>
<script>if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))</script>
</body>
</html>
